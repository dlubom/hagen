  <title id="title">Kälbergruben-Windloch, 1335/70. Profil poligonowy W–E</title>
  <desc id="desc">Rzut ciągów podziemnych i powierzchniowych na pionową płaszczyznę W–E siatki UTM. Obie osie mają jednakową skalę. Dolny otwór na wysokości 1661 m jest punktem nawiązania. Górny otwór z pomiarów Survex ma wysokość 1724,04 m, a podana wysokość wynosi 1729 m.</desc>
